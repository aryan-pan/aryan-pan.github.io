# RealmOS session configuration. Per-user overrides: ~/.config/realm/realm.conf

# Leave unset to meet other installations on the local network by broadcast.
# Set to a relay (server/realm-relay.py) to join installations across the internet.
#server=realm.example.org:4777

# Applications opened from the desk bar (Super+Enter, Super+E, Super+B).
terminal=foot
files=thunar
editor=mousepad
browser=epiphany-browser

#keyboard_layout=us
